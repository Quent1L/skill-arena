services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: skol-postgres-e2e
    environment:
      POSTGRES_USER: skolarena
      POSTGRES_PASSWORD: skolarena
      POSTGRES_DB: skolarena_e2e
    ports:
      - '5435:5432' # dev=5432, load-test=5434
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skolarena -d skolarena_e2e']
      interval: 2s
      timeout: 3s
      retries: 15
