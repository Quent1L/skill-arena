# Throwaway Postgres for the showcase screenshots pipeline.
#
# Separate from the e2e database (frontend/e2e/docker-compose.yml, port 5435):
# the seed here is tuned for pretty screenshots, not for assertions, and the two
# must never overwrite each other.
services:
  postgres-showcase:
    image: postgres:16-alpine
    container_name: skol-postgres-showcase
    environment:
      POSTGRES_USER: skolarena
      POSTGRES_PASSWORD: skolarena
      POSTGRES_DB: skolarena_showcase
    ports:
      - '5436:5432' # dev=5432, load-test=5434, e2e=5435
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skolarena -d skolarena_showcase']
      interval: 2s
      timeout: 3s
      retries: 15
